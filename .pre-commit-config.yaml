repos:

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files

- repo: local
  hooks:

  - id: ruff
    name: ruff (linting)
    language: system
    entry: ruff check --fix
    types: [python]

  - id: ruff
    name: ruff (formatting)
    language: system
    entry: ruff format
    types: [python]

  - id: mypy
    name: mypy (type checking)
    language: system
    entry: mypy
    types: [python]
