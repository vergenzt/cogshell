[package]
name = "cogshell"
version = "0.1.0"
edition = "2024"
description = "CogShell: Generate parts of files with shell scripts"
authors = ["Tim Vergenz <vergenzt@gmail.com>"]
license = "MIT"
readme = "README.md"

[dependencies]
annotate-snippets = "0.12.13"
anstream = { version = "1.0.0", features = ["auto"] }
base64 = "0.22.1"
bpaf = "0.9.24"
hex = "0.4.3"
md5 = "0.8.0"
regex = "1"
tempfile = "3"
thiserror = "2.0.18"
uuid = { version = "1.23.0", features = ["v4"] }

[dev-dependencies]
yare = "3.0.0"
